name: Pablo@OpenAI Developers

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pablo research run
        run: |
          echo "Pablo@OpenAI Developers starting"
          echo "Research upcoming daily fixtures across MULTIPLE configured football leagues."
          echo "Never invent fixtures, lineups, points, results or media."

      - name: Multi-league research rules
        run: |
          echo "Search every configured league, not just one league."
          echo "Include Premier League, LaLiga, Serie A, Bundesliga, Ligue 1 and all other leagues configured by the FootballPoints system."
          echo "Do not limit research to the most popular league when other configured leagues have matches."
          echo "For each league, collect upcoming/daily fixtures, teams and kickoff times from trusted football data."
          echo "Keep league identity attached to every fixture so matches from different leagues never get mixed together."
          echo "Process each league independently and continue if one league's data source fails."

      - name: Team, roster and player media research
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Pablo roster mission: for each researched fixture, retrieve the two teams' current roster."
          echo "Store player name, verified position, team, optional shirt number and player face when supplied."
          echo "Store team crest/logo when supplied."
          echo "Use free public football web data; no paid football API subscription is required by this step."
          echo "If a source does not provide a reliable image, leave the image empty and continue."
          node pablo_roster_sync.mjs

      - name: Fallback rules for missing players
        run: |
          echo "If the normal players table has no players for a fixture team, the website must fall back to Pablo's fp_players roster database."
          echo "Never show an empty player list when a verified roster exists in fp_players."
          echo "Never invent a player, position, team membership, logo or face."
          echo "Players must be loaded before kickoff so stakers can select them."

      - name: Lineups and points
        run: |
          echo "For every league and fixture, use official starting lineups when published."
          echo "Collect player points from trusted available data after points become available."
          echo "Calculate total points for every staker's selected players across the relevant fixture."
          echo "Rank leaderboard results from highest points to lowest points."
          echo "Do not calculate from invented or missing player statistics."

      - name: Validate football data/settlement files
        run: |
          test -f settle_fixtures.mjs
          test -f fixture_reliability.js
          test -f pablo_roster_sync.mjs
          echo "Required football files are present"

      - name: Finish health check
        run: |
          echo "Pablo@OpenAI Developers completed multi-league research and roster cycle"
          echo "Next scheduled run is within six hours"

      - name: Publish robot health status
        if: always()
        env:
          RUN_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          path = Path('robot_status.json')
          try:
              old = json.loads(path.read_text())
          except Exception:
              old = {}

          now = datetime.now(timezone.utc)
          base = now.replace(minute=17, second=0, microsecond=0)
          while base <= now:
              base += timedelta(hours=6)

          status = os.environ.get('RUN_STATUS', 'failure').lower()
          success = status == 'success'
          old['robot'] = 'Pablo@OpenAI Developers'
          old['status'] = 'ONLINE' if success else 'FAILED'
          old['last_run_at'] = now.isoformat()
          old['next_expected_at'] = base.isoformat()
          old['current_activity'] = ('Researching multiple leagues, fixtures, team rosters, player positions, faces and team logos; preparing data for player selection.'
                                     if success else
                                     'A research/roster/validation step failed. Check the GitHub Actions run logs.')
          old['last_error'] = None if success else 'One or more research/roster/validation steps failed; inspect GitHub Actions logs.'
          if success:
              old['last_success_at'] = now.isoformat()
          path.write_text(json.dumps(old, indent=2) + '\n')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robot_status.json
          git diff --cached --quiet || git commit -m "Update Pablo robot health status"
          git push
