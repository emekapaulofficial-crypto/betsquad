name: FootballPoints daily real fixture sync

on:
  schedule:
    - cron: "5 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: footballpoints-daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Supabase client
        run: npm install @supabase/supabase-js
      - name: Sync real fixtures from all configured leagues
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          FOOTBALL_API_BASE_URL: https://v3.football.api-sports.io
          FOOTBALL_LEAGUE_IDS: ${{ vars.FOOTBALL_LEAGUE_IDS || '39,140,2,78,61' }}
          FOOTBALL_SEASON: ${{ vars.FOOTBALL_SEASON || '2026' }}
          FOOTBALL_DAYS_AHEAD: "14"
          SYNC_SQUADS: "false"
        run: node scripts/footballpoints_sync.mjs
      - name: Mirror verified data into existing app tables
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/footballpoints_compat.mjs
