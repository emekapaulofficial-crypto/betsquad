name: Sync real daily fixtures

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync_daily_fixtures.yml"

concurrency:
  group: footballpoints-fixture-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync real Premier League fixtures
        env:
          SUPABASE_URL: https://eavamfsbasjvngeqsyua.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_E40QKzlb3dtIoawvmxPHfA_07t2XIxu
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --retry 5 --retry-delay 3 \
            -X POST "$SUPABASE_URL/functions/v1/sync-fixtures" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{}')"
          echo "$response"
          echo "$response" | grep -q '"ok":true'
