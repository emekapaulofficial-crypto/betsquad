name: FootballPoints Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository for obvious secret files
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '*.pem' -o -name '*.key' -o -name '*service-account*.json' \) -not -path './.git/*' | grep -q .; then
            echo 'Potential private-key file found in repository.'
            exit 1
          fi
      - name: Check source for obvious live-secret formats
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git --exclude='*.md' -E 'sb_secret_[A-Za-z0-9]+|sk_live_[A-Za-z0-9]+|AKIA[0-9A-Z]{16}' .; then
            echo 'Potential hard-coded live secret found.'
            exit 1
          fi
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in *.js scripts/*.mjs; do
            [ -f "$f" ] || continue
            node --check "$f"
          done
