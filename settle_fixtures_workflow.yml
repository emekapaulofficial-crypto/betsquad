# Save this file as .github/workflows/settle_fixtures.yml in your repo.
#
# Before this works, add two repository secrets in GitHub:
# Settings -> Secrets and variables -> Actions -> New repository secret
#   SUPABASE_URL              (your project URL)
#   SUPABASE_SERVICE_ROLE_KEY (Project Settings -> API -> service_role key
#                               -- this one is secret, never put it in app.js)

name: Settle fixtures

on:
  schedule:
    # Runs every 20 minutes. Adjust as needed — more frequent on match
    # days, less frequent otherwise, to stay within free-tier limits.
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Run settlement script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node settle_fixtures.mjs
